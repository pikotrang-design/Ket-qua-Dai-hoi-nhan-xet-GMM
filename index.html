<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Kết GMM</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #d32f2f; text-align: center; }
        .section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .top5-list { list-style: none; padding: 0; }
        .top5-list li { background: #ffebee; margin: 5px 0; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; font-weight: bold; }
        .match-box { background: #e3f2fd; padding: 20px; border-radius: 8px; text-align: center; }
        input[type="text"], input[type="password"] { padding: 10px; margin: 5px; width: 80%; max-width: 300px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1565c0; }
        #match-result { margin-top: 15px; font-weight: bold; color: #2e7d32; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎉 Kết Quả Đại Hội Nhận Xét GMM 🎉</h1>
    
    <!-- Mục Top 5 -->
    <div class="section">
        <h2>🏆 Top 5 "Muốn Lắm Ạ"</h2>
        <ul class="top5-list" id="top5-container">
            <li>Đang tải dữ liệu...</li>
        </ul>
    </div>

    <!-- Mục Tra cứu Match -->
    <div class="section match-box">
        <h2>❤️ Trạm Match Bạn Chung Đường ❤️</h2>
        <p>Nhập tên và mật mã bí mật của bạn để xem ai đã "match" với mình nhé!</p>
        <input type="text" id="username" placeholder="Nhập tên của bạn (VD: Thúi Thúi)"><br>
        <input type="password" id="password" placeholder="Mật mã bí mật"><br>
        <button onclick="checkMatch()">Tra Cứu</button>
        <div id="match-result"></div>
    </div>
</div>

<script>
    // THAY ĐƯỜNG LINK APPS SCRIPT CỦA BẠN VÀO ĐÂY
    const API_URL = "https://script.google.com/macros/s/AKfycbzh3bVDYF5o_ToASq6HkWPxJEgG5S5dSUU3luaKgGNUBGP6TKc36caTc3FSkfhBVBa61g/exec";

    // Hàm gọi API lấy Top 5
    async function loadTop5() {
        try {
            const response = await fetch(`${API_URL}?action=getTop5`);
            const data = await response.json();
            if (data.status === "success") {
                const container = document.getElementById('top5-container');
                container.innerHTML = '';
                data.data.forEach((person, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>#${index + 1} ${person.name}</span> <span>${person.votes} lượt</span>`;
                    container.appendChild(li);
                });
            }
        } catch (error) {
            document.getElementById('top5-container').innerHTML = "<li>Lỗi không tải được dữ liệu.</li>";
        }
    }

    // Hàm kiểm tra Match
    async function checkMatch() {
        const name = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const resultDiv = document.getElementById('match-result');
        
        if(!name || !pass) {
            resultDiv.innerHTML = "<span style='color:red;'>Vui lòng nhập đủ thông tin!</span>";
            return;
        }

        resultDiv.innerHTML = "Đang kiểm tra tín hiệu vũ trụ...";

        try {
            const response = await fetch(`${API_URL}?action=getMatch&name=${encodeURIComponent(name)}&pass=${encodeURIComponent(pass)}`);
            const data = await response.json();
            
            if (data.status === "success") {
                resultDiv.innerHTML = `Tèn ten! Những người bạn đã match thành công: <br> <b>${data.matchResult}</b>`;
            } else {
                resultDiv.innerHTML = `<span style='color:red;'>${data.message}</span>`;
            }
        } catch (error) {
            resultDiv.innerHTML = "<span style='color:red;'>Có lỗi xảy ra, thử lại sau nhé!</span>";
        }
    }

    // Tự động tải Top 5 khi mở web
    window.onload = loadTop5;
</script>

</body>
</html>
