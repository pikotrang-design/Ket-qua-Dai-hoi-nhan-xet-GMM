<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Kết GMM</title>
    <!-- Thêm thư viện vẽ biểu đồ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Thêm Font chữ Google (Be Vietnam Pro) -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ĐỔI FONT CHỮ VÀ HÌNH NỀN Ở ĐÂY */
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; /* Đã đổi font chữ mới */
            color: #333; 
            margin: 0; 
            padding: 20px; 
            
            /* -- CÁCH ĐỔI HÌNH NỀN -- 
               Hiện tại mình đang để nền dải màu gradient mờ mờ cho dễ nhìn. 
               Nếu bạn muốn dùng ảnh thật, hãy xóa dấu /* ở dòng dưới và dán link ảnh của bạn vào nhé: */
            /* background-image: url('LINK_ẢNH_CỦA_BẠN_DÁN_VÀO_ĐÂY'); */
            
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-size: cover;
            background-attachment: fixed;
        }
        
        .container { max-width: 900px; margin: auto; background: transparent; }
        
        .header-title { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 8px solid #d32f2f; margin-bottom: 25px; text-align: center; }
        .header-title h1 { color: #d32f2f; margin: 0; }
        
        .section { background: rgba(255, 255, 255, 0.95); margin-bottom: 25px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section h2 { color: #1976d2; border-bottom: 2px solid #e3f2fd; padding-bottom: 12px; margin-top: 0;}
        
        /* HIỆU ỨNG ĐỘNG (ANIMATIONS) */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up {
            opacity: 0; /* Ẩn đi trước khi chạy hiệu ứng */
            animation: slideUp 0.8s ease-out forwards;
        }
        /* Độ trễ để các khối hiện lên lần lượt */
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* Cột Top 5 */
        .top5-list { list-style: none; padding: 0; }
        .top5-list li { background: #fff3e0; margin: 10px 0; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em; color: #e65100; border: 1px solid #ffe0b2; transition: transform 0.2s;}
        .top5-list li:hover { transform: scale(1.02); } /* Hiệu ứng phình to khi rà chuột */
        
        /* Trạm Match */
        .match-box { background: #e3f2fd; border: 1px solid #bbdefb; }
        .match-box h2 { color: #1565c0; border-bottom: none;}
        input[type="text"], input[type="password"] { padding: 12px; margin: 10px 0; width: 100%; max-width: 350px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit;}
        button { padding: 12px 28px; background: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.05em; transition: 0.3s; font-family: inherit;}
        button:hover { background: #1565c0; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1);}
        #match-result { margin-top: 15px; font-weight: bold; color: #2e7d32; font-size: 1.2em; }
        
        /* Từng câu hỏi (Khối kết quả) */
        .result-block { margin-bottom: 35px; }
        .result-block h3 { color: #333; font-size: 1.15em; margin-bottom: 12px; }
        .avg-score { font-weight: bold; color: #d32f2f; font-size: 1.2em; margin-bottom: 15px; }
        .chart-container { position: relative; height: 320px; width: 100%; }
        
        /* List câu trả lời chữ */
        .text-responses { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; background: #fafafa; border: 1px solid #eee; border-radius: 8px;}
        .text-responses li { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.95em; line-height: 1.6; transition: background 0.2s;}
        .text-responses li:hover { background: #f0f0f0; }
        .text-responses li:last-child { border-bottom: none; }
        .text-responses li::before { content: "💬 "; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title animate-up">
        <h1>🎉 Kết Quả Đại Hội Nhận Xét GMM 🎉</h1>
    </div>
    
    <!-- ĐÃ DỜI LÊN TRÊN: Toàn bộ kết quả -->
    <div class="section animate-up delay-1">
        <h2>📊 Chi Tiết Đánh Giá Từ Các Thành Viên</h2>
        <div id="all-results-container">Đang tải dữ liệu từ Google Form...</div>
    </div>

    <!-- ĐÃ DỜI XUỐNG DƯỚI: Mục Top 5 -->
    <div class="section animate-up delay-2">
        <h2>🏆 Top 5 "Muốn Lắm Ạ" Nhất Nhóm</h2>
        <ul class="top5-list" id="top5-container">
            <li>Đang phân tích tín hiệu vũ trụ...</li>
        </ul>
    </div>

    <!-- ĐÃ DỜI XUỐNG CUỐI CÙNG: Mục Tra cứu Match -->
    <div class="section match-box animate-up delay-3" style="text-align: center;">
        <h2>❤️ Trạm Match Bạn Chung Đường ❤️</h2>
        <p>Nhập tên và mật mã bí mật của bạn để xem ai đã "match" với mình nhé!</p>
        <input type="text" id="username" placeholder="Nhập tên của bạn (VD: Thúi Thúi)"><br>
        <input type="password" id="password" placeholder="Mật mã bí mật"><br>
        <button onclick="checkMatch()">Tra Cứu Match</button>
        <div id="match-result"></div>
    </div>
</div>

<script>
    // ĐIỀN ĐƯỜNG LINK APPS SCRIPT CỦA BẠN VÀO ĐÂY NHÉ:
    const API_URL = "https://script.google.com/macros/s/AKfycbzh3bVDYF5o_ToASq6HkWPxJEgG5S5dSUU3luaKgGNUBGP6TKc36caTc3FSkfhBVBa61g/exec";

    // 1. Load Toàn bộ dữ liệu
    async function loadAllData() {
        try {
            const response = await fetch(`${API_URL}?action=getAllData`);
            const data = await response.json();
            if (data.status === "success") {
                const container = document.getElementById('all-results-container');
                container.innerHTML = '';
                
                const headers = data.headers;
                const rows = data.rows;
                
                headers.forEach((header, colIndex) => {
                    // LỆNH ẨN CÂU HỎI "BẠN TÊN LÀ?" (Nếu tiêu đề chứa chữ "tên là" thì bỏ qua)
                    if (header.toLowerCase().includes("bạn tên là")) return;

                    let colValues = rows.map(r => r[colIndex]).filter(v => v !== "" && v !== null);
                    if (colValues.length === 0) return;
                    
                    let isNumeric = colValues.every(v => !isNaN(v) && v !== "");
                    
                    const block = document.createElement('div');
                    block.className = 'result-block';
                    
                    const title = document.createElement('h3');
                    title.innerText = header;
                    block.appendChild(title);
                    
                    if (isNumeric) {
                        let sum = colValues.reduce((a, b) => a + Number(b), 0);
                        let avg = (sum / colValues.length).toFixed(1); 
                        
                        const avgText = document.createElement('div');
                        avgText.className = 'avg-score';
                        avgText.innerText = `Điểm trung bình: ${avg} / 10`;
                        block.appendChild(avgText);
                        
                        let counts = {};
                        for(let i=1; i<=10; i++) counts[i] = 0;
                        colValues.forEach(v => { counts[Number(v)] = (counts[Number(v)] || 0) + 1; });
                        
                        const chartDiv = document.createElement('div');
                        chartDiv.className = 'chart-container';
                        const canvas = document.createElement('canvas');
                        chartDiv.appendChild(canvas);
                        block.appendChild(chartDiv);
                        container.appendChild(block);
                        
                        new Chart(canvas, {
                            type: 'bar',
                            data: {
                                labels: Object.keys(counts),
                                datasets: [{
                                    label: 'Số lượng bình chọn',
                                    data: Object.values(counts),
                                    backgroundColor: '#ff7675', // Đổi màu cột biểu đồ cho xinh xắn hơn
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                                plugins: { legend: { display: false } }
                            }
                        });
                    } else {
                        const ul = document.createElement('ul');
                        ul.className = 'text-responses';
                        colValues.forEach(v => {
                            const li = document.createElement('li');
                            li.innerText = v;
                            ul.appendChild(li);
                        });
                        block.appendChild(ul);
                        container.appendChild(block);
                    }
                });
            }
        } catch (error) {
            document.getElementById('all-results-container').innerHTML = "Lỗi khi tải toàn bộ dữ liệu form.";
        }
    }

    // 2. Load Top 5
    async function loadTop5() {
        try {
            const response = await fetch(`${API_URL}?action=getTop5`);
            const data = await response.json();
            if (data.status === "success") {
                const container = document.getElementById('top5-container');
                container.innerHTML = '';
                data.data.forEach((person, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>#${index + 1} ${person.name}</span> <span>${person.votes} lượt muốn làm chung</span>`;
                    container.appendChild(li);
                });
            }
        } catch (error) {
            document.getElementById('top5-container').innerHTML = "<li>Lỗi không tải được dữ liệu Top 5.</li>";
        }
    }

    // 3. Kiểm tra Match
    async function checkMatch() {
        const name = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const resultDiv = document.getElementById('match-result');
        
        if(!name || !pass) {
            resultDiv.innerHTML = "<span style='color:#d32f2f;'>Vui lòng nhập đủ thông tin!</span>";
            return;
        }
        resultDiv.innerHTML = "Đang kiểm tra tín hiệu vũ trụ...";

        try {
            const response = await fetch(`${API_URL}?action=getMatch&name=${encodeURIComponent(name)}&pass=${encodeURIComponent(pass)}`);
            const data = await response.json();
            
            if (data.status === "success") {
                resultDiv.innerHTML = `Tèn ten! Những người bạn đã match thành công: <br> <span style="color:#d32f2f; font-size: 1.3em;">${data.matchResult}</span>`;
            } else {
                resultDiv.innerHTML = `<span style='color:#d32f2f;'>${data.message}</span>`;
            }
        } catch (error) {
            resultDiv.innerHTML = "<span style='color:#d32f2f;'>Có lỗi xảy ra, thử lại sau nhé!</span>";
        }
    }

    // Chạy khi mở web
    window.onload = () => {
        loadAllData();
        loadTop5();
    };
</script>

</body>
</html>
